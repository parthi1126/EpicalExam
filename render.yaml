services:
  - type: web
    name: flask-google-sheets-app
    env: python
    plan: free

    runtime: python  # Explicitly use Python runtime
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT

    pythonVersion: 3.11.9  # ✅ Use stable Python version with prebuilt wheels

    envVars:
      - key: FLASK_SECRET_KEY
        value: your-very-secure-secret-key
